<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: rgb(255, 69, 69);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 300px;
            background: #f14020;
            padding: 20px;
            border-radius: 8px;
        }

        .box input {
            width: 100%;
            height: 35px;
            margin-bottom: 10px;
            padding-left: 10px;
            border: none;
            background: #ffffff;
            border-radius: 3px;
        }

        .box button {
            width: 100%;
            height: 35px;
            border: none;
            background: #0021f9;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        .box button:hover {
            background: #c8e14c;
        }

        .box p {
            text-align: center;
            margin-top: 15px;
        }

        .box a {
            color: blue;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <form class="box" id="btn">
        <input type="text" name="name" placeholder="Name">
    
        <input type="email" name="email" placeholder="Email">
    
        <input type="text" name="phone" placeholder="Phone">
    
        <input type="password" name="password" placeholder="Password">
    
        <input type="password" name="confirmPassword" placeholder="Confirm Password">
    
        <button type="submit" >Sign Up</button>
    
        <p>Already have an account? <a href="./hw1.html">Sign In</a></p>
    </form>

    <script src="./hw.js"></script>

</body>

</html>
