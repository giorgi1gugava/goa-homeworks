<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f05a5a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 300px;
            background: #f12727;
            padding: 20px;
            border-radius: 8px;
            
        }

        .box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .box input {
            width: 100%;
            height: 35px;
            margin-bottom: 10px;
            padding-left: 10px;
            border: none;
            background: #ffffff;
            border-radius: 3px;
        }

        .box button {
            width: 100%;
            height: 35px;
            border: none;
            background: #2200ff;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        

        .box p {
            text-align: center;
            margin-top: 15px;
        }

        .box a {
            color: blue;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <form class="box" id="loginForm">

        <input type="email" name="email" placeholder="Email">
    
        <input type="password" name="password" placeholder="Password">
    
        <a href="" id="a"><button type="submit" id="signUp">Sign In</button></a>
    
        <p >Don't have an account? <a href="./hw.html">Sign Up</a></p>
    
    </form>

    <script>
        let login = document.getElementById("loginForm");
        


        login.addEventListener("submit", (e) => {
            e.preventDefault();


            let info = {
                email: e.target.email.value.trim(),
                password: e.target.password.value.trim()
            };


            console.log(info);
            
                alert("success!");
            
            
        });
        
    </script>
</body>

</html>
